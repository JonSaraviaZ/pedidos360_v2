<main class="container">
  <h1>Pedidos 360</h1>
  <p>
    Frontend Cloud Native
  </p>
  <hr>
  <button (click) ="login()">
    Iniciar Sesion
  </button>
  <button (click) ="verSesion()">
    Ver Sesion
  </button>
  <button (click) ="logout()">
    Cerrar Sesion
  </button>

  @if (autenticado){
    <section>
      <h2>Usuario Autenticado</h2>
      <p>{{usuario}}</p>

      <h3>Access Token</h3>
      <textarea rows="10" cols="80" readonly>{{token}}</textarea>
    </section>
  }

</main>
